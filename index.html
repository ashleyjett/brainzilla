<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17162b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>BrainZilla</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#f8f5ff;background:#17162b}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:calc(env(safe-area-inset-top) + 24px) 20px 110px}header{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:850;font-size:28px}.muted{color:#aaa8c4;font-size:13px}.panel{background:#26243d;border-radius:22px;padding:20px;margin:20px 0}.hero{background:linear-gradient(130deg,#49357b,#34274c)}h1{font-size:25px;margin:10px 0}h2{font-size:17px;margin:0 0 12px}textarea,input,select{width:100%;border:1px solid #595270;background:#1b1a30;color:white;border-radius:12px;padding:13px;font:inherit}textarea{resize:vertical;min-height:90px}button{border:0;border-radius:12px;background:#d9b7ff;color:#231631;font-weight:750;padding:13px 17px;font:inherit;cursor:pointer}.primary{width:100%;margin-top:12px;font-weight:750}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#26243d;border-radius:15px;padding:15px;text-align:center}.stat strong{font-size:25px;color:#e6caff;display:block}.stat span{font-size:12px;color:#b6b1cb}.tabs{display:flex;gap:8px;overflow:auto;margin:22px 0 14px}.tabs button{background:#2b2943;color:#c7c2dc;white-space:nowrap;padding:10px 14px}.tabs button.active{background:#d9b7ff;color:#241533}.item{background:#26243d;border-radius:16px;padding:14px;margin:10px 0;display:flex;gap:12px;align-items:flex-start}.item.done{opacity:.55}.item.done .bodytext{text-decoration:line-through}.item .content{flex:1;min-width:0;overflow-wrap:anywhere}.item small{color:#b4afca}.item p{margin:0 0 8px;white-space:pre-wrap}.iconbtn{background:#38354f;color:#e3d3ff;padding:8px 10px}.check{accent-color:#cda3ff;width:20px;height:20px;margin-top:3px}.actions{display:flex;gap:8px;align-items:center}.empty{text-align:center;color:#b4afca;padding:30px 12px}.toolbar{display:flex;gap:8px;margin-top:12px}.toolbar>*{flex:1;min-width:0}.toolbar input{flex:1.4}.bottom{position:fixed;bottom:0;left:0;right:0;background:#201e35;border-top:1px solid #3e3855;padding:12px 12px calc(env(safe-area-inset-bottom) + 12px);display:flex;justify-content:space-around}.bottom button{background:transparent;color:#bbb5d3;padding:7px 10px;font-size:12px}.bottom button.active{color:#e5caff}.pill{display:inline-block;background:#41385a;color:#ead8ff;border-radius:30px;padding:4px 8px;font-size:11px;margin-top:5px}dialog{background:#29263f;color:white;border:1px solid #6d5c8a;border-radius:18px;width:min(92vw,460px)}dialog label{display:block;margin:12px 0 5px;font-size:13px}dialog menu{display:flex;gap:10px;padding:0;justify-content:flex-end}dialog menu button:first-child{background:#48435e;color:white}</style></head><body><main><header><div><div class="logo">🧠 BrainZilla</div><div class="muted">Your brain, but organized.</div></div><div style="font-size:30px">✨</div></header><section class="panel hero"><div class="muted" id="date"></div><h1>What's on your mind?</h1><textarea id="capture" placeholder="Dump a thought, task, reminder, or brilliant idea..."></textarea><div class="toolbar"><select id="type"><option value="inbox">📥 Inbox</option><option value="task">✅ Task</option><option value="idea">💡 Idea</option><option value="note">📝 Note</option></select><select id="category"><option>Personal</option><option>Work</option><option>Neddy+Rose</option><option>Family</option></select></div><button class="primary" id="add">+ Save to my brain</button></section><div class="stats"><div class="stat"><strong id="todoCount">0</strong><span>To do</span></div><div class="stat"><strong id="ideaCount">0</strong><span>Ideas</span></div><div class="stat"><strong id="todayCount">0</strong><span>Due today</span></div></div><div class="tabs" id="tabs"></div><section><h2 id="heading">Your inbox</h2><div id="items"></div></section></main><nav class="bottom" id="nav"></nav><dialog id="editor"><form method="dialog" id="editform"><h2>Edit thought</h2><label for="edittext">What's on your mind?</label><textarea id="edittext" required></textarea><label for="edittype">Type</label><select id="edittype"><option value="inbox">Inbox</option><option value="task">Task</option><option value="idea">Idea</option><option value="note">Note</option></select><label for="editcat">Category</label><select id="editcat"><option>Personal</option><option>Work</option><option>Neddy+Rose</option><option>Family</option></select><label for="editdate">Due date (optional)</label><input id="editdate" type="date"><menu><button value="cancel">Cancel</button><button id="saveedit" value="save">Save changes</button></menu></form></dialog><script>
const KEY='brainzilla-v1';let data=[];try{const parsed=JSON.parse(localStorage.getItem(KEY)||'[]');data=Array.isArray(parsed)?parsed:[]}catch{}let view='inbox',editId=null;const $=id=>document.getElementById(id);const today=()=>new Date().toLocaleDateString('en-CA');$('date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('Storage is unavailable. Your changes may not be saved.')}render()}function add(){let text=$('capture').value.trim();if(!text)return;$('capture').value='';data.unshift({id:crypto.randomUUID(),text,type:$('type').value,category:$('category').value,done:false,due:'',created:Date.now()});persist()}$('add').onclick=add;function setView(v){view=v;render()}function render(){const pending=data.filter(x=>x.type==='task'&&!x.done);$('todoCount').textContent=pending.length;$('ideaCount').textContent=data.filter(x=>x.type==='idea').length;$('todayCount').textContent=pending.filter(x=>x.due===today()).length;const views=[['inbox','📥 Inbox'],['today','📅 Today'],['task','✅ Tasks'],['idea','💡 Ideas'],['all','🗂 All']];$('tabs').replaceChildren(...views.map(([id,label])=>{let b=document.createElement('button');b.textContent=label;b.className=view===id?'active':'';b.onclick=()=>setView(id);return b}));$('nav').replaceChildren(...[['inbox','📥 Inbox'],['today','📅 Today'],['task','✅ Tasks'],['idea','💡 Ideas']].map(([id,label])=>{let b=document.createElement('button');b.textContent=label;b.className=view===id?'active':'';b.onclick=()=>setView(id);return b}));$('heading').textContent=({inbox:'Your inbox',today:'Today & overdue',task:'Your tasks',idea:'Your ideas',all:'Everything in your brain'})[view];let items=data.filter(x=>view==='all'||(view==='today'&&x.type==='task'&&!x.done&&x.due&&x.due<=today())||(view!=='today'&&x.type===view));const root=$('items');root.replaceChildren();if(!items.length){let p=document.createElement('div');p.className='empty';p.textContent=view==='today'?'Nothing due. Enjoy the breathing room! ✨':'Nothing here yet. Capture your first thought above!';root.append(p)}for(let x of items){let card=document.createElement('div');card.className='item'+(x.done?' done':'');if(x.type==='task'){let check=document.createElement('input');check.type='checkbox';check.className='check';check.checked=!!x.done;check.setAttribute('aria-label','Mark task complete');check.onchange=()=>{x.done=check.checked;persist()};card.append(check)}let content=document.createElement('div');content.className='content';let p=document.createElement('p');p.className='bodytext';p.textContent=x.text;content.append(p);let meta=document.createElement('small');meta.textContent=`${x.category} · ${x.type}${x.due?' · Due '+x.due:''}`;content.append(meta);card.append(content);let actions=document.createElement('div');actions.className='actions';let edit=document.createElement('button');edit.className='iconbtn';edit.textContent='✎';edit.setAttribute('aria-label','Edit');edit.onclick=()=>openEdit(x.id);actions.append(edit);let del=document.createElement('button');del.className='iconbtn';del.textContent='×';del.setAttribute('aria-label','Delete');del.onclick=()=>{if(confirm('Delete this thought?')){data=data.filter(y=>y.id!==x.id);persist()}};actions.append(del);card.append(actions);root.append(card)}}function openEdit(id){let x=data.find(y=>y.id===id);if(!x)return;editId=id;$('edittext').value=x.text;$('edittype').value=x.type;$('editcat').value=x.category;$('editdate').value=x.due||'';$('editor').showModal()}$('editform').addEventListener('submit',e=>{if(e.submitter?.value!=='save')return;let x=data.find(y=>y.id===editId);if(!x)return;let t=$('edittext').value.trim();if(!t){e.preventDefault();return}x.text=t;x.type=$('edittype').value;x.category=$('editcat').value;x.due=$('editdate').value;persist()});render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
